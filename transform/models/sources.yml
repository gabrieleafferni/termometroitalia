version: 2

sources:
  - name: carburanti_raw
    description: >
      Data lake dei carburanti, scritto da pipeline/carburanti/ingest.py.
      Fonte originale: MIMIT - Osservaprezzi Carburanti (licenza IODL 2.0).
    meta:
      external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/carburanti/{name}/*/*.parquet', filename = true, union_by_name = true)"
    tables:
      - name: prezzi
        description: Uno snapshot completo per ogni data di estrazione MIMIT.
        columns:
          - name: id_impianto
          - name: carburante
          - name: prezzo
          - name: self
          - name: dt_comunicazione
      - name: impianti
        description: >
          Change log (SCD tipo 2) dell'anagrafica impianti. La colonna indirizzo
          esiste dai file del 2/10/2026: i file precedenti si leggono con union_by_name.
        columns:
          - name: id_impianto
          - name: valido_dal
          - name: azione
      - name: settimanali
        description: >
          Serie settimanale MASE dal 2005 (prezzi al consumo e netti), uno snapshot
          per ogni pubblicazione. Scritta da pipeline/carburanti/settimanali.py.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/carburanti/{name}/*.parquet', filename = true)"

  - name: istat_raw
    description: >
      Dati ISTAT scritti da pipeline/istat/. Fonte: esploradati.istat.it (API SDMX),
      licenza CC BY 4.0.
    meta:
      external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/{name}/*.parquet', filename = true)"
    tables:
      - name: nic
        description: >
          Indice NIC mensile, indice generale, Italia, in tutte le basi pubblicate
          (1995, 2010, 2015, 2025). Uno snapshot per ogni pubblicazione che cambia la serie.
        columns:
          - name: mese
          - name: base
          - name: indice
          - name: provvisorio

