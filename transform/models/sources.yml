version: 2

sources:
  - name: carburanti_raw
    description: >
      Data lake dei carburanti, scritto da pipeline/carburanti/ingest.py.
      Fonte originale: MIMIT - Osservaprezzi Carburanti (licenza IODL 2.0).
    meta:
      external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/carburanti/{name}/*/*.parquet', filename = true, union_by_name = true)"
    tables:
      - name: prezzi
        description: Uno snapshot completo per ogni data di estrazione MIMIT.
        columns:
          - name: id_impianto
          - name: carburante
          - name: prezzo
          - name: self
          - name: dt_comunicazione
      - name: impianti
        description: >
          Change log (SCD tipo 2) dell'anagrafica impianti. La colonna indirizzo
          esiste dai file del 2/10/2026: i file precedenti si leggono con union_by_name.
        columns:
          - name: id_impianto
          - name: valido_dal
          - name: azione
      - name: settimanali
        description: >
          Serie settimanale MASE dal 2005 (prezzi al consumo e netti), uno snapshot
          per ogni pubblicazione. Scritta da pipeline/carburanti/settimanali.py.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/carburanti/{name}/*.parquet', filename = true)"

  - name: istat_raw
    description: >
      Dati ISTAT scritti da pipeline/istat/. Fonte: esploradati.istat.it (API SDMX),
      licenza CC BY 4.0.
    meta:
      external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/{name}/*.parquet', filename = true)"
    tables:
      - name: nic
        description: >
          Indice NIC mensile, indice generale, Italia, in tutte le basi pubblicate
          (1995, 2010, 2015, 2025). Uno snapshot per ogni pubblicazione che cambia la serie.
        columns:
          - name: mese
          - name: base
          - name: indice
          - name: provvisorio

  - name: mercati_raw
    description: >
      Quotazioni di mercato scritte da pipeline/mercati/quotazioni.py: Brent e prodotti
      raffinati NY Harbor (FRED, dati EIA, pubblico dominio) e cambio di riferimento BCE.
    meta:
      external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/mercati/{name}/*/*.parquet')"
    tables:
      - name: quotazioni
        description: Una riga per giorno e serie, file mensili.
        columns:
          - name: data
          - name: serie
          - name: valore
          - name: fonte

  - name: salari_raw
    description: >
      Dati sui salari scritti da pipeline/istat/retribuzioni.py (ISTAT, CC BY 4.0),
      pipeline/eurostat/ipca.py e pipeline/internazionale/salari.py (OCSE ed Eurostat).
      Uno snapshot per ogni pubblicazione che cambia i dati; si usa l'ultimo.
    tables:
      - name: contrattuali
        description: Indici delle retribuzioni contrattuali, base dicembre 2021, mensili, per settore e qualifica.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/retribuzioni/contrattuali_2*.parquet', filename = true)"
      - name: contrattuali_storico
        description: Le stesse serie nelle basi 2005, 2010 e 2015 (scaricate una volta sola).
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/retribuzioni/contrattuali_storico.parquet')"
      - name: tensione
        description: Contratti in attesa di rinnovo (quota di dipendenti, mesi di attesa) per comparto.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/retribuzioni/tensione_2*.parquet', filename = true)"
      - name: oros
        description: Retribuzioni lorde di fatto per Ula (OROS), base 2021, trimestrali.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/retribuzioni/oros_2*.parquet', filename = true)"
      - name: racli
        description: Retribuzione lorda oraria del settore privato (RACLI) per sesso e settore.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/retribuzioni/racli_2*.parquet', filename = true)"
      - name: racli_province
        description: Retribuzione lorda oraria del settore privato (RACLI) per sesso e provincia.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/istat/retribuzioni/racli_province_2*.parquet', filename = true)"
      - name: ipca
        description: IPCA Italia (Eurostat prc_hicp_minr), base 2025, mensile dal 1996.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/eurostat/ipca/ipca_*.parquet', filename = true)"
      - name: salari_medi_ocse
        description: OCSE, Average annual wages (dollari PPA a prezzi costanti; euro).
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/ocse/salari_medi_*.parquet', filename = true)"
      - name: salario_tempo_pieno
        description: Eurostat nama_10_fte, salario medio annuo per dipendente a tempo pieno, euro correnti.
        meta:
          external_location: "read_parquet('{{ env_var('TERMOMETRO_DATA_DIR', '../data') }}/raw/eurostat/salari/salario_tempo_pieno_*.parquet', filename = true)"
