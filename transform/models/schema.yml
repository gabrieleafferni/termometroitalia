version: 2

models:
  - name: stg_carburanti__prezzi
    description: Prezzi grezzi tipizzati, una riga per impianto x prodotto x modalità x giorno.
    columns:
      - name: data
        tests: [not_null]
      - name: id_impianto
        tests: [not_null]
      - name: carburante
        tests:
          - accepted_values:
              arguments:
                values: ["benzina", "gasolio", "gpl", "metano", "altro"]
      - name: modalita
        tests:
          - accepted_values:
              arguments:
                values: ["self", "servito"]

  - name: stg_carburanti__impianti
    description: Anagrafica corrente degli impianti ricostruita dal change log.
    columns:
      - name: id_impianto
        tests: [unique, not_null]
      - name: tipo_impianto
        tests:
          - accepted_values:
              arguments:
                values: ["Stradale", "Autostradale", "Altro"]
              config:
                severity: warn

  - name: int_carburanti__prezzi_validi
    description: Prezzi dei 4 carburanti base con geografia e flag di qualità.

  - name: mart_carburanti__nazionale_giornaliero
    description: Serie nazionale giornaliera (media, mediana, percentili).
    columns:
      - name: data
        tests: [not_null]
      - name: media
        tests: [not_null]
      - name: n_impianti
        tests: [not_null]

  - name: mart_carburanti__regionale_giornaliero
    description: Media per regione e giorno, con scarto dalla media italiana.
    columns:
      - name: regione
        tests: [not_null]

  - name: mart_carburanti__provinciale_giornaliero
    description: Media per provincia e giorno.
    columns:
      - name: sigla
        tests: [not_null]

  - name: mart_carburanti__impianti_oggi
    description: Un impianto per riga nell'ultimo giorno, per la mappa.
    columns:
      - name: id_impianto
        tests: [unique, not_null]
      - name: lat
        tests: [not_null]
      - name: lon
        tests: [not_null]

  - name: mart_carburanti__bandiere_oggi
    description: Prezzo medio per marchio nell'ultimo giorno.

  - name: mart_carburanti__tipo_impianto_giornaliero
    description: Strada vs autostrada, per giorno.

  - name: stg_carburanti__settimanali
    description: Ultimo snapshot della serie settimanale MASE.

  - name: mart_carburanti__storico_settimanale
    description: >
      Serie settimanale MASE dal 2005 con tasse, massimo precedente e prezzo reale
      (deflazionato con il NIC ISTAT ai prezzi dell'ultimo mese disponibile).
    columns:
      - name: data
        tests: [not_null]
      - name: prezzo
        tests: [not_null]
      - name: prezzo_reale
        tests: [not_null]

  - name: stg_istat__nic
    description: Ultimo snapshot dell'indice NIC ISTAT, una riga per mese e base.

  - name: int_istat__nic_concatenato
    description: Indice NIC dal 1996 in un'unica serie in base 2025 = 100.
    columns:
      - name: mese
        tests: [unique, not_null]
      - name: indice
        tests: [not_null]

  - name: mart_carburanti__marchi_giornaliero
    description: Prezzo per marchio e giorno (rete stradale) con adesione al tetto Eni.
    columns:
      - name: marchio
        tests: [not_null]
      - name: quota_entro_tetto_eni
        tests: [not_null]

  - name: stg_mercati__quotazioni
    description: Quotazioni giornaliere (Brent, raffinati NY Harbor, cambio BCE) in formato lungo.

  - name: mart_mercati__quotazioni_giornaliere
    description: >
      Quotazioni giornaliere in dollari e in euro al litro (Brent, gasolio e benzina
      NY Harbor) con il cambio BCE. Base dati per i modelli di previsione.
    columns:
      - name: data
        tests: [unique, not_null]
      - name: usd_per_eur
        tests: [not_null]

  - name: mart_carburanti__barile_settimanale
    description: >
      Settimana × carburante dal 2005: prezzo industriale MASE e costo del Brent in
      euro al litro (media della settimana precedente), differenza, valori reali.
    columns:
      - name: brent_eur_litro
        tests: [not_null]
      - name: differenza
        tests: [not_null]

  - name: int_salari__contrattuali_concatenate
    description: >
      Retribuzioni contrattuali (ISTAT) in un'unica serie dal 2005, base dicembre 2021 = 100,
      raccordando le basi 2005, 2010, 2015 e 2021 nel dicembre di ciascuna base.
    columns:
      - name: indice
        tests: [not_null]

  - name: int_salari__deflatori
    description: NIC e IPCA mese per mese, base 2025 = 100; l'ultimo valore disponibile copre i mesi mancanti.
    columns:
      - name: mese
        tests: [unique, not_null]

  - name: mart_salari__reali_mensile
    description: >
      Retribuzioni contrattuali nominali e reali (NIC, IPCA) per mese, tipo, qualifica e
      settore, con medie mobili di 12 mesi e variazioni su un anno.
    columns:
      - name: reale_nic
        tests: [not_null]
      - name: reale_ipca
        tests: [not_null]

  - name: mart_salari__settori
    description: Variazione nominale e reale per settore, ultimi 12 mesi contro il 2021 e il 2019.
    columns:
      - name: var_reale_nic
        tests: [not_null]

  - name: mart_salari__tensione
    description: Quota di dipendenti in attesa di rinnovo del contratto e mesi di attesa, per comparto.
    columns:
      - name: quota_in_attesa
        tests: [not_null]

  - name: mart_salari__di_fatto_trimestrale
    description: Retribuzioni di fatto per Ula (OROS, destagionalizzate) nominali e reali, per trimestre e settore.
    columns:
      - name: reale_nic
        tests: [not_null]

  - name: mart_salari__internazionale
    description: Salario medio annuo per paese (OCSE in dollari PPA a prezzi costanti, Eurostat in euro).
    columns:
      - name: nome
        tests: [not_null]

  - name: mart_salari__racli
    description: Retribuzione lorda oraria del settore privato (RACLI) per anno, sesso e settore.
    columns:
      - name: mediana
        tests: [not_null]

  - name: mart_salari__racli_province
    description: Retribuzione lorda oraria del settore privato (RACLI) per anno, provincia e sesso.
    columns:
      - name: sigla
        tests: [not_null]
      - name: mediana
        tests: [not_null]
