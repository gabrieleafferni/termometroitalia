name: Aggiornamento quotidiano
# calendario attivato da Gabriele il 28/09/2026

on:
  schedule:
    # Il MIMIT pubblica i prezzi di ogni giorno (in vigore alle 8:00) di solito la
    # mattina successiva, ma l'orario varia; GitHub inoltre può ritardare o saltare
    # singole esecuzioni programmate. Per questo si controlla ogni 2 ore (al minuto
    # 23, lontano dallo scoccare dell'ora, quando i server sono più carichi).
    # La pipeline è idempotente: se non c'è niente di nuovo, non salva e non ripubblica.
    - cron: "23 */2 * * *"
    # Giro del mattino: parte poco prima della pubblicazione MIMIT (circa le 9:30 ora
    # italiana). Orari in UTC: 7:20 UTC = 9:20 con l'ora legale, 8:20 con l'ora solare.
    # In pratica GitHub salta o ritarda di ore molti giri programmati: per questo
    # OGNI giro programmato, se i dati di ieri non sono ancora usciti, li aspetta
    # (vedi il passo 1). Basta che un giro qualsiasi parta tra la notte e la
    # mattina perché i dati arrivino pochi minuti dopo la pubblicazione.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      fonte:
        description: "Fonte dei dati carburanti"
        type: choice
        options: [auto, mimit, mirror]
        default: auto
      attendi_minuti:
        description: "Se i dati di ieri non sono ancora pubblicati, aspettali per N minuti"
        type: string
        default: "0"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "transform/**"
      - "pipeline/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write   # per il passaggio di testimone (avvio di un nuovo giro)
  pages: write
  id-token: write

concurrency:
  group: aggiornamento
  # un giro in corso (anche in attesa della pubblicazione) non viene interrotto:
  # i giri programmati che arrivano nel frattempo restano in coda e partono dopo,
  # così c'è sempre qualcuno che aspetta i dati. (Per provare subito una modifica
  # al codice mentre un giro è in attesa, annulla quel giro dalla pagina Actions.)
  cancel-in-progress: false

jobs:
  pipeline:
    name: Raccolta, trasformazione e build
    runs-on: ubuntu-latest
    # massimo consentito da GitHub: 360 minuti (attesa fino a 320 + elaborazione)
    timeout-minutes: 345
    outputs:
      pubblica: ${{ steps.salva.outputs.pubblica }}
    steps:
      - uses: actions/checkout@v6
        with:
          # l'ultimo commit di main quando il giro parte davvero: un giro programmato
          # rimasto in coda dietro a uno in attesa, altrimenti, riparte dal commit di
          # quando è stato messo in coda e al salvataggio va in conflitto (3/10/2026)
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze Python
        run: pip install -r requirements.txt

      - name: 1 · Raccolta prezzi carburanti (MIMIT)
        run: |
          ATTESA="${{ inputs.attendi_minuti }}"
          if [ -z "$ATTESA" ]; then
            ATTESA=0
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # I giri programmati aspettano i dati di ieri fino alle 14:00 ora italiana,
              # al massimo 320 minuti (limite di durata di un job GitHub).
              # Se i dati sono già usciti, lo script non aspetta affatto.
              ADESSO=$(date +%s)
              LIMITE=$(TZ=Europe/Rome date -d "today 14:00" +%s)
              ATTESA=$(( (LIMITE - ADESSO) / 60 ))
              if [ "$ATTESA" -lt 0 ]; then ATTESA=0; fi
              if [ "$ATTESA" -gt 320 ]; then ATTESA=320; fi
            fi
          fi
          echo "Attesa massima della pubblicazione: $ATTESA minuti"
          python -m pipeline.carburanti.ingest --source "${{ inputs.fonte || 'auto' }}" --attendi-minuti "$ATTESA"

          # Passaggio di testimone: se questo giro stava aspettando ma i dati di ieri non
          # sono ancora usciti (attesa finita per il limite dei 320 minuti) e non sono
          # ancora le 14:00, avvia un nuovo giro che continua ad aspettare. GitHub di norma
          # non fa partire giri dagli eventi creati con il GITHUB_TOKEN, ma fa eccezione
          # per gli avvii manuali (workflow_dispatch): è proprio quello che serve qui.
          ULTIMO=$(jq -r .data_estrazione data/raw/carburanti/ultimo_aggiornamento.json)
          IERI=$(TZ=Europe/Rome date -d yesterday +%F)
          RESTANO=$(( ($(TZ=Europe/Rome date -d "today 14:00" +%s) - $(date +%s)) / 60 ))
          if [ "$ATTESA" -gt 0 ] && [[ "$ULTIMO" < "$IERI" ]] && [ "$RESTANO" -gt 10 ]; then
            PROSSIMA=$(( RESTANO > 320 ? 320 : RESTANO ))
            echo "Dati ancora fermi al $ULTIMO: avvio un nuovo giro che aspetta fino a $PROSSIMA minuti."
            gh workflow run aggiornamento.yml --ref main -f fonte=auto -f attendi_minuti="$PROSSIMA"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 1b · Serie settimanale MASE (dal 2005)
        # fonte esterna con protezioni anti-bot: se fallisce si usa l'ultimo snapshot
        # salvato e la pipeline giornaliera prosegue (un test dbt avvisa se è ferma da 3 settimane)
        continue-on-error: true
        run: python -m pipeline.carburanti.settimanali

      - name: 1c · Indice dei prezzi al consumo NIC (ISTAT)
        # una sola richiesta all'API SDMX dell'ISTAT (limite: 5 al minuto per IP).
        # Se fallisce si usa l'ultimo snapshot salvato: i prezzi reali restano
        # calcolati e un test dbt avvisa se l'indice è fermo da più di 75 giorni
        continue-on-error: true
        timeout-minutes: 6
        run: python -m pipeline.istat.nic

      - name: 2 · Trasformazione e test di qualità (dbt)
        working-directory: transform
        run: dbt build --profiles-dir .

      - name: 3 · Novità del giorno
        run: |
          python -m pipeline.insights
          {
            echo "## Novità del $(jq -r .aggiornato_al data/marts/novita.json)"
            jq -r '.novita[] | "- **" + .titolo + "**: " + .testo' data/marts/novita.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 4 · Salvataggio dei dati nel repository
        id: salva
        run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # si salva solo se cambiano i dati veri (nuova estrazione o mart diversi):
          # i mart sono deterministici, quindi a parità di dati non cambiano di un byte.
          # Le sole date di generazione (novita.json, ultimo_aggiornamento.json) non bastano.
          if git diff --cached --quiet -- data/raw/carburanti/prezzi data/raw/carburanti/impianti data/raw/carburanti/settimanali data/raw/istat 'data/marts/*.parquet'; then
            echo "Nessun dato nuovo da salvare."
            git reset -q
            # senza dati nuovi, i run programmati non ripubblicano il sito
            echo "pubblica=${{ github.event_name != 'schedule' }}" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Dati carburanti del $(jq -r .data_estrazione data/raw/carburanti/ultimo_aggiornamento.json)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pubblica=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 5 · Esportazione per il sito
        if: steps.salva.outputs.pubblica == 'true'
        run: python -m pipeline.export_site

      - uses: actions/setup-node@v6
        if: steps.salva.outputs.pubblica == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 6 · Build del sito
        if: steps.salva.outputs.pubblica == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        if: steps.salva.outputs.pubblica == 'true'
        with:
          path: site/dist

  pubblicazione:
    name: Pubblicazione su GitHub Pages
    needs: pipeline
    if: needs.pipeline.outputs.pubblica == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
