name: Esplorazione fonti (temporaneo)
on:
  push:
    branches: [esplorazione]
    paths: [".github/workflows/esplora.yml", "esplorazione/*.py", "pipeline/**"]
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diagnosi del MIMIT (dal 16/10 non risponde)
        timeout-minutes: 15
        run: python esplorazione/diagnosi_mimit.py
      - name: Salva sul ramo di esplorazione
        if: always()
        run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esplorazione
          git commit -m "Diagnosi MIMIT: risultati" && git push origin HEAD:esplorazione || echo "niente da salvare"
