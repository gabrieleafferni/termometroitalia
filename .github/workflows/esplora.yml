name: Esplorazione fonti (temporaneo)
on:
  push:
    branches: [esplorazione]
    paths: [".github/workflows/esplora.yml", "esplorazione/*.py", "pipeline/**"]
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Esplora fonti per i salari (prova dei moduli)
        run: |
          pip install pyarrow
          python esplorazione/esplora_salari2.py
      - name: Salva sul ramo di esplorazione
        if: always()
        run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esplorazione
          git commit -m "Esplorazione salari: risultati" && git push origin HEAD:esplorazione || echo "niente da salvare"
